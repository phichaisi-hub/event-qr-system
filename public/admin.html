<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการ Event และรายงานการเข้างาน</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Sarabun', 'Sukhumvit Set', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        .card-header-primary {
            background-color: #0d6efd;
            color: #ffffff;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: bold;
            padding: 12px 20px;
        }
        .card-header-success {
            background-color: #198754;
            color: #ffffff;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: bold;
            padding: 12px 20px;
        }
        .card-header-dark {
            background-color: #343a40;
            color: #ffffff;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: bold;
            padding: 12px 20px;
        }
        .table-scroll-container {
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }
        .table-scroll-container thead th {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 10;
            box-shadow: inset 0 -1px 0 #dee2e6;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header แสดงชื่อผู้ใช้ & ปุ่ม Logout -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <h3 class="fw-bold text-dark mb-0">⚙️ ระบบจัดการ Event และรายงานการเข้างาน</h3>
            <div class="d-flex align-items-center">
                <span class="me-3 fs-6">👤 <b id="userDisplayFullName">-</b> (<span id="userDisplayRole" class="badge bg-primary">ROLE</span>)</span>
                <button id="btnLogout" class="btn btn-outline-danger btn-sm fw-bold">ออกจากระบบ</button>
            </div>
        </div>

        <!-- [ส่วนพิเศษ] จัดการ User (เฉพาะ System Admin เท่านั้น) -->
        <div id="userManagementSection" class="card card-custom d-none">
            <div class="card-header card-header-dark">
                👑 จัดการผู้ใช้งานระบบ ( System Admin Only )
            </div>
            <div class="card-body p-4">
                <form id="userForm" class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label for="u_username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="u_username" required placeholder="ชื่อผู้ใช้">
                    </div>
                    <div class="col-md-3">
                        <label for="u_password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="u_password" required placeholder="รหัสผ่าน">
                    </div>
                    <div class="col-md-3">
                        <label for="u_fullname" class="form-label fw-semibold">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="u_fullname" required placeholder="เช่น นายสมชาย">
                    </div>
                    <div class="col-md-3">
                        <label for="u_role" class="form-label fw-semibold">สิทธิ์ผู้ใช้งาน <span class="text-danger">*</span></label>
                        <select class="form-select" id="u_role">
                            <option value="SUPERVISOR">Supervisor</option>
                            <option value="SCANNER">Scanner</option>
                            <option value="ADMIN">System Admin</option>
                        </select>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-dark px-4 fw-bold">+ เพิ่มผู้ใช้งาน</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 60px;" class="text-center">ID</th>
                                <th>Username</th>
                                <th>ชื่อ-นามสกุล</th>
                                <th style="width: 140px;" class="text-center">สิทธิ์</th>
                                <th style="width: 100px;" class="text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- [ส่วนที่ 1] จัดการ Event (เพิ่ม/แก้ไข/Import) -->
        <div class="card card-custom">
            <div class="card-header card-header-primary">
                1. จัดการรายชื่อ Event (เพิ่ม/แก้ไข/Import Excel)
            </div>
            <div class="card-body p-4">
                
                <form id="eventForm" class="row g-3 mb-4">
                    <input type="hidden" id="event_id" value="">
                    
                    <div class="col-md-5">
                        <label for="event_name" class="form-label fw-semibold">ชื่องาน Event <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="event_name" required placeholder="กรอกชื่องาน เช่น งานนิทรรศการ 2026">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="location" class="form-label fw-semibold">สถานที่จัดงาน</label>
                        <input type="text" class="form-control" id="location" placeholder="เช่น Hall 101, BITEC">
                    </div>
                    
                    <div class="col-md-3">
                        <label for="event_date" class="form-label fw-semibold">วันที่จัดงาน</label>
                        <input type="date" class="form-control" id="event_date">
                    </div>

                    <div class="col-12 text-end">
                        <button type="button" id="btnResetEvent" class="btn btn-secondary me-2 d-none">ยกเลิก</button>
                        <button type="submit" id="btnSaveEvent" class="btn btn-success px-4">บันทึก Event</button>
                    </div>
                </form>

                <hr class="my-4">

                <div class="row align-items-center mb-3">
                    <div class="col-md-9">
                        <form id="importForm" class="d-flex align-items-center">
                            <label class="form-label me-2 mb-0 text-nowrap">Import รายชื่อ Event จาก Excel (คอลัมน์: event_name, location, event_date):</label>
                            <input type="file" class="form-control me-2" id="excel_file" accept=".xlsx, .xls" required>
                            <button type="submit" class="btn btn-outline-primary text-nowrap">นำเข้า Excel</button>
                        </form>
                    </div>
                </div>

                <div class="table-scroll-container">
                    <table class="table table-bordered table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 70px;" class="text-center">ID</th>
                                <th>ชื่องาน Event</th>
                                <th>สถานที่</th>
                                <th style="width: 140px;" class="text-center">วันที่จัดงาน</th>
                                <th style="width: 140px;" class="text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="eventTableBody"></tbody>
                    </table>
                </div>

            </div>
        </div>

        <!-- [ส่วนที่ 2] Export รายงานการเข้างาน -->
        <div class="card card-custom">
            <div class="card-header card-header-success">
                2. ออกรายงานการเข้าปฏิบัติงาน (Export Excel)
            </div>
            <div class="card-body p-4">
                <form id="reportForm" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="report_event_id" class="form-label fw-semibold">เลือกชื่องาน Event</label>
                        <select class="form-select" id="report_event_id">
                            <option value="">-- ทั้งหมดทุก Event --</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="start_date" class="form-label fw-semibold">ตั้งแต่วันที่ (สแกนเข้างาน)</label>
                        <input type="date" class="form-control" id="start_date">
                    </div>

                    <div class="col-md-3">
                        <label for="end_date" class="form-label fw-semibold">ถึงวันที่ (สแกนเข้างาน)</label>
                        <input type="date" class="form-control" id="end_date">
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100 fw-bold">📊 ดาวน์โหลด Excel</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin Custom JS -->
    <script src="js/admin.js?v=2.0"></script>
</body>
</html>
