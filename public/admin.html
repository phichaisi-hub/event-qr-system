<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการ Event และรายงานการเข้างาน</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        .card-header-custom {
            background-color: #0d6efd;
            color: #ffffff;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: bold;
        }
        /* กำหนดพื้นที่ตารางให้มีแถบเลื่อน (Scrollbar) สำหรับ 10 รายการ */
        .table-scroll-container {
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }
        /* ตรึงหัวตารางให้อยู่ด้านบนขณะเลื่อนดูรายการ */
        .table-scroll-container thread th {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 1;
            box-shadow: inset 0 -1px 0 #dee2e6;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">⚙️ ระบบจัดการ Event และรายงานการเข้างาน</h2>
        </div>

        <!-- [ส่วนที่ 1] จัดการ Event (เพิ่ม/แก้ไข/Import) -->
        <div class="card card-custom">
            <div class="card-header card-header-custom">
                1. จัดการรายชื่อ Event (เพิ่ม/แก้ไข/Import Excel)
            </div>
            <div class="card-body">
                
                <!-- ฟอร์มเพิ่ม / แก้ไข Event -->
                <form id="eventForm" class="row g-3 mb-4">
                    <input type="hidden" id="event_id" value="">
                    
                    <div class="col-md-5">
                        <label for="event_name" class="form-label font-semibold">ชื่องาน Event <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="event_name" required placeholder="กรอกชื่องาน เช่น งานนิทรรศการ 2026">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="location" class="form-label">สถานที่จัดงาน</label>
                        <input type="text" class="form-control" id="location" placeholder="เช่น Hall 101, BITEC">
                    </div>
                    
                    <div class="col-md-3">
                        <label for="event_date" class="form-label">วันที่จัดงาน</label>
                        <input type="date" class="form-control" id="event_date">
                    </div>

                    <div class="col-12 text-end">
                        <button type="button" id="btnResetEvent" class="btn btn-secondary me-2 d-none">ยกเลิก</button>
                        <button type="submit" id="btnSaveEvent" class="btn btn-success px-4">บันทึก Event</button>
                    </div>
                </form>

                <hr>

                <!-- ฟอร์ม Import Excel -->
                <div class="row align-items-center mb-3">
                    <div class="col-md-8">
                        <form id="importForm" class="d-flex align-items-center">
                            <label class="form-label me-2 mb-0 text-nowrap">Import รายชื่อ Event จาก Excel (คอลัมน์: event_name, location, event_date):</label>
                            <input type="file" class="form-control me-2" id="excel_file" accept=".xlsx, .xls" required>
                            <button type="submit" class="btn btn-outline-primary text-nowrap">นำเข้า Excel</button>
                        </form>
                    </div>
                </div>

                <!-- ตารางแสดงรายการ Event (พร้อมแถบเลื่อนแนวตั้ง) -->
                <div class="table-scroll-container">
                    <table class="table table-bordered table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 60px;" class="text-center">ID</th>
                                <th>ชื่องาน Event</th>
                                <th>สถานที่</th>
                                <th style="width: 120px;" class="text-center">วันที่จัดงาน</th>
                                <th style="width: 130px;" class="text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="eventTableBody">
                            <!-- รายการ Event จะถูกโหลดมาใส่ตรงนี้ผ่าน admin.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <!-- [ส่วนที่ 2] Export รายงานการเข้างาน -->
        <div class="card card-custom">
            <div class="card-header card-header-custom bg-success">
                2. ออกรายงานการเข้าปฏิบัติงาน (Export Excel)
            </div>
            <div class="card-body">
                <form id="reportForm" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="report_event_id" class="form-label">เลือกชื่องาน Event</label>
                        <select class="form-select" id="report_event_id">
                            <option value="">-- ทั้งหมดทุก Event --</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="start_date" class="form-label">ตั้งแต่วันที่ (สแกนเข้างาน)</label>
                        <input type="date" class="form-control" id="start_date">
                    </div>

                    <div class="col-md-3">
                        <label for="end_date" class="form-label">ถึงวันที่ (สแกนเข้างาน)</label>
                        <input type="date" class="form-control" id="end_date">
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">📊 ดาวน์โหลด Excel</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin Custom JS -->
    <script src="js/admin.js?v=1.2"></script>
</body>
</html>
