<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการ Event และรายงานการเข้างาน</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Sarabun', 'Sukhumvit Set', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        .card-header-primary {
            background-color: #0d6efd;
            color: #ffffff;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: bold;
            padding: 12px 20px;
        }
        .card-header-success {
            background-color: #198754;
            color: #ffffff;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: bold;
            padding: 12px 20px;
        }
        .card-header-dark {
            background-color: #343a40;
            color: #ffffff;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: bold;
            padding: 12px 20px;
        }
        .table-scroll-container {
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }
        .table-scroll-container thead th {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 10;
            box-shadow: inset 0 -1px 0 #dee2e6;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header แสดงชื่อผู้ใช้ & ปุ่ม Logout -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <h3 class="fw-bold text-dark mb-0">⚙️ ระบบจัดการ Event และรายงานการเข้างาน</h3>
            <div class="d-flex align-items-center">
                <span class="me-3 fs-6">👤 <b id="userDisplayFullName">-</b> (<span id="userDisplayRole" class="badge bg-primary">ROLE</span>)</span>
                <button id="btnOpenPasswordModal" class="btn btn-outline-secondary btn-sm me-2 fw-bold">เปลี่ยนรหัสผ่าน</button>
                <button id="btnLogout" class="btn btn-outline-danger btn-sm fw-bold">ออกจากระบบ</button>
            </div>
        </div>

        <!-- [ส่วนพิเศษ] จัดการ User (เฉพาะ System Admin เท่านั้น) -->
        <div id="userManagementSection" class="card card-custom d-none">
            <div class="card-header card-header-dark">
                👑 จัดการผู้ใช้งานระบบ ( System Admin Only )
            </div>
            <div class="card-body p-4">
                <form id="userForm" class="row g-3 mb-4">
                    <input type="hidden" id="edit_user_id" value="">
                    <div class="col-md-3">
                        <label for="u_username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="u_username" required placeholder="ชื่อผู้ใช้">
                    </div>
                    <div class="col-md-3">
                        <label for="u_password" class="form-label fw-semibold">Password <span id="pwdHint" class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="u_password" required placeholder="รหัสผ่าน">
                    </div>
                    <div class="col-md-3">
                        <label for="u_fullname" class="form-label fw-semibold">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="u_fullname" required placeholder="เช่น นายสมชาย">
                    </div>
                    <div class="col-md-3">
                        <label for="u_role" class="form-label fw-semibold">สิทธิ์ผู้ใช้งาน <span class="text-danger">*</span></label>
                        <select class="form-select" id="u_role">
                            <option value="SUPERVISOR">Supervisor</option>
                            <option value="SCANNER">Scanner</option>
                            <option value="ADMIN">System Admin</option>
                        </select>
                    </div>
                    <div class="col-12 text-end">
                        <button type="button" id="btnCancelUserEdit" class="btn btn-secondary me-2 d-none">ยกเลิก</button>
                        <button type="submit" id="btnSaveUser" class="btn btn-dark px-4 fw-bold">+ เพิ่มผู้ใช้งาน</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 60px;" class="text-center">ID</th>
                                <th>Username</th>
                                <th>ชื่อ-นามสกุล</th>
                                <th style="width: 140px;" class="text-center">สิทธิ์</th>
                                <th style="width: 140px;" class="text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- [ส่วนที่ 1] จัดการ Event (เพิ่ม/แก้ไข/Import/Export) -->
        <div class="card card-custom">
            <div class="card-header card-header-primary">
                1. จัดการรายชื่อ Event (เพิ่ม/แก้ไข/Import & Export Excel)
            </div>
            <div class="card-body p-4">
                
                <form id="eventForm" class="row g-3 mb-4">
                    <input type="hidden" id="event_id" value="">
                    
                    <div class="col-md-5">
                        <label for="event_name" class="form-label fw-semibold">ชื่องาน Event <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="event_name" required placeholder="กรอกชื่องาน เช่น งานนิทรรศการ 2026">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="location" class="form-label fw-semibold">สถานที่จัดงาน</label>
                        <input type="text" class="form-control" id="location" placeholder="เช่น Hall 101, BITEC">
                    </div>
                    
                    <div class="col-md-3">
                        <label for="event_date" class="form-label fw-semibold">วันที่จัดงาน</label>
                        <input type="date" class="form-control" id="event_date">
                    </div>

                    <div class="col-12 text-end">
                        <button type="button" id="btnResetEvent" class="btn btn-secondary me-2 d-none">ยกเลิก</button>
                        <button type="submit" id="btnSaveEvent" class="btn btn-success px-4">บันทึก Event</button>
                    </div>
                </form>

                <hr class="my-4">

                <!-- ช่อง Import และ Export รายชื่อ Event -->
                <div class="row align-items-center mb-3">
                    <div class="col-md-12">
                        <form id="importForm" class="d-flex align-items-center gap-2">
                            <label class="form-label mb-0 text-nowrap fw-semibold">จัดการ Excel Event:</label>
                            <input type="file" class="form-control" id="excel_file" accept=".xlsx, .xls" required>
                            <button type="submit" class="btn btn-outline-primary text-nowrap">นำเข้า Excel</button>
                            <button type="button" id="btnExportEvents" class="btn btn-outline-success text-nowrap">📥 Export รายชื่อ Event</button>
                        </form>
                    </div>
                </div>

                <div class="table-scroll-container">
                    <table class="table table-bordered table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 70px;" class="text-center">ID</th>
                                <th>ชื่องาน Event</th>
                                <th>สถานที่</th>
                                <th style="width: 140px;" class="text-center">วันที่จัดงาน</th>
                                <th style="width: 140px;" class="text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="eventTableBody"></tbody>
                    </table>
                </div>

            </div>
        </div>

        <!-- [ส่วนที่ 2] Export รายงานการเข้างาน -->
        <div class="card card-custom">
            <div class="card-header card-header-success">
                2. ออกรายงานการเข้าปฏิบัติงาน (Export Excel)
            </div>
            <div class="card-body p-4">
                <form id="reportForm" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="report_event_id" class="form-label fw-semibold">เลือกชื่องาน Event</label>
                        <select class="form-select" id="report_event_id">
                            <option value="">-- ทั้งหมดทุก Event --</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="start_date" class="form-label fw-semibold">ตั้งแต่วันที่ (สแกนเข้างาน)</label>
                        <input type="date" class="form-control" id="start_date">
                    </div>

                    <div class="col-md-3">
                        <label for="end_date" class="form-label fw-semibold">ถึงวันที่ (สแกนเข้างาน)</label>
                        <input type="date" class="form-control" id="end_date">
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100 fw-bold">📊 ดาวน์โหลด Excel</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Modal เปลี่ยนรหัสผ่านตนเอง -->
    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">เปลี่ยนรหัสผ่าน</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm">
                        <div class="mb-3">
                            <label class="form-label">รหัสผ่านเดิม</label>
                            <input type="password" id="old_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">รหัสผ่านใหม่</label>
                            <input type="password" id="new_password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">ยืนยันการเปลี่ยนรหัสผ่าน</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;
        let allUsers = [];
        let allEvents = [];

        document.addEventListener("DOMContentLoaded", function () {
            const userData = localStorage.getItem("currentUser");
            if (!userData) {
                window.location.href = "login.html";
                return;
            }

            currentUser = JSON.parse(userData);
            document.getElementById("userDisplayFullName").textContent = currentUser.fullname;
            document.getElementById("userDisplayRole").textContent = currentUser.role;

            if (currentUser.role === 'ADMIN') {
                document.getElementById("userManagementSection").classList.remove("d-none");
                loadUsers();
            }

            loadEvents();

            document.getElementById("btnLogout").addEventListener("click", function () {
                localStorage.removeItem("currentUser");
                window.location.href = "login.html";
            });

            document.getElementById("btnOpenPasswordModal").addEventListener("click", function () {
                const myModal = new bootstrap.Modal(document.getElementById('passwordModal'));
                myModal.show();
            });

            document.getElementById("changePasswordForm").addEventListener("submit", function (e) {
                e.preventDefault();
                const old_password = document.getElementById("old_password").value;
                const new_password = document.getElementById("new_password").value;

                fetch(`/api/users/${currentUser.id}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password, new_password })
                })
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) throw new Error(data.error);
                    alert("เปลี่ยนรหัสผ่านสำเร็จ!");
                    location.reload();
                })
                .catch(err => alert(err.message));
            });

            // จัดการฟอร์มผู้ใช้งาน (Admin)
            document.getElementById("userForm").addEventListener("submit", function (e) {
                e.preventDefault();
                const editId = document.getElementById("edit_user_id").value;
                const username = document.getElementById("u_username").value.trim();
                const password = document.getElementById("u_password").value;
                const fullname = document.getElementById("u_fullname").value.trim();
                const role = document.getElementById("u_role").value;

                const url = editId ? `/api/users/${editId}` : '/api/users';
                const method = editId ? 'PUT' : 'POST';

                fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, fullname, role })
                })
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) throw new Error(data.error);
                    alert(data.message);
                    resetUserForm();
                    loadUsers();
                })
                .catch(err => alert(err.message));
            });

            document.getElementById("btnCancelUserEdit").addEventListener("click", resetUserForm);

            // จัดการฟอร์ม Event
            document.getElementById("eventForm").addEventListener("submit", function (e) {
                e.preventDefault();
                const editId = document.getElementById("event_id").value;
                const event_name = document.getElementById("event_name").value.trim();
                const location = document.getElementById("location").value.trim();
                const event_date = document.getElementById("event_date").value;

                const url = editId ? `/api/events/${editId}` : '/api/events';
                const method = editId ? 'PUT' : 'POST';

                fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event_name, location, event_date })
                })
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) throw new Error(data.error);
                    alert(editId ? "อัปเดต Event สำเร็จ" : "เพิ่ม Event สำเร็จ");
                    resetEventForm();
                    loadEvents();
                })
                .catch(err => alert(err.message));
            });

            document.getElementById("btnResetEvent").addEventListener("click", resetEventForm);

            // นำเข้า Event Excel
            document.getElementById("importForm").addEventListener("submit", function (e) {
                e.preventDefault();
                const fileInput = document.getElementById("excel_file");
                if (fileInput.files.length === 0) return alert("กรุณาเลือกไฟล์ Excel");

                const formData = new FormData();
                formData.append("excel_file", fileInput.files[0]);

                fetch('/api/events/import', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) throw new Error(data.error);
                    alert(data.message);
                    fileInput.value = '';
                    loadEvents();
                })
                .catch(err => alert(err.message));
            });

            // ปุ่ม Export รายชื่อ Event ออกมาเป็น Excel (Template เดียวกัน)
            document.getElementById("btnExportEvents").addEventListener("click", function () {
                window.location.href = '/api/events/export-excel';
            });

            // ออกรายงาน Excel
            document.getElementById("reportForm").addEventListener("submit", function (e) {
                e.preventDefault();
                const event_id = document.getElementById("report_event_id").value;
                const start_date = document.getElementById("start_date").value;
                const end_date = document.getElementById("end_date").value;

                let url = `/api/export-excel?`;
                const params = [];
                if (event_id) params.push(`event_id=${event_id}`);
                if (start_date) params.push(`start_date=${start_date}`);
                if (end_date) params.push(`end_date=${end_date}`);
                url += params.join('&');

                window.location.href = url;
            });
        });

        function loadUsers() {
            fetch('/api/users')
                .then(res => res.json())
                .then(users => {
                    allUsers = users;
                    const tbody = document.getElementById("userTableBody");
                    tbody.innerHTML = '';
                    users.forEach(u => {
                        let roleBadge = 'bg-secondary';
                        if (u.role === 'ADMIN') roleBadge = 'bg-danger';
                        else if (u.role === 'SUPERVISOR') roleBadge = 'bg-warning text-dark';
                        else if (u.role === 'SCANNER') roleBadge = 'bg-info text-dark';

                        tbody.innerHTML += `
                            <tr>
                                <td class="text-center">${u.id}</td>
                                <td><b>${u.username}</b></td>
                                <td>${u.fullname}</td>
                                <td class="text-center"><span class="badge ${roleBadge}">${u.role}</span></td>
                                <td class="text-center">
                                    <button class="btn btn-warning btn-sm fw-bold me-1" onclick="editUser(${u.id})">แก้ไข</button>
                                    ${u.id !== currentUser.id ? `<button class="btn btn-danger btn-sm fw-bold" onclick="deleteUser(${u.id})">ลบ</button>` : '-'}
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        function editUser(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            document.getElementById("edit_user_id").value = user.id;
            document.getElementById("u_username").value = user.username;
            document.getElementById("u_username").disabled = true;
            document.getElementById("u_password").value = '';
            document.getElementById("u_password").required = false;
            document.getElementById("pwdHint").textContent = "(เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยน)";
            document.getElementById("u_fullname").value = user.fullname;
            document.getElementById("u_role").value = user.role;
            document.getElementById("btnSaveUser").textContent = "อัปเดตผู้ใช้งาน";
            document.getElementById("btnSaveUser").className = "btn btn-warning px-4 fw-bold";
            document.getElementById("btnCancelUserEdit").classList.remove("d-none");
        }

        function resetUserForm() {
            document.getElementById("edit_user_id").value = '';
            document.getElementById("u_username").value = '';
            document.getElementById("u_username").disabled = false;
            document.getElementById("u_password").value = '';
            document.getElementById("u_password").required = true;
            document.getElementById("pwdHint").textContent = "*";
            document.getElementById("u_fullname").value = '';
            document.getElementById("u_role").value = 'SUPERVISOR';
            document.getElementById("btnSaveUser").textContent = "+ เพิ่มผู้ใช้งาน";
            document.getElementById("btnSaveUser").className = "btn btn-dark px-4 fw-bold";
            document.getElementById("btnCancelUserEdit").classList.add("d-none");
        }

        function deleteUser(id) {
            if (!confirm("คุณต้องการลบผู้ใช้งานนี้ใช่หรือไม่?")) return;
            fetch(`/api/users/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    loadUsers();
                });
        }

        function loadEvents() {
            fetch('/api/events')
                .then(res => res.json())
                .then(events => {
                    allEvents = events;
                    const tbody = document.getElementById("eventTableBody");
                    const reportSelect = document.getElementById("report_event_id");

                    tbody.innerHTML = '';
                    reportSelect.innerHTML = '<option value="">-- ทั้งหมดทุก Event --</option>';

                    if (events.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">ยังไม่มีชื่องาน Event ในระบบ</td></tr>';
                        return;
                    }

                    events.forEach(ev => {
                        const formattedDate = ev.event_date ? new Date(ev.event_date).toISOString().split('T')[0] : '-';
                        tbody.innerHTML += `
                            <tr>
                                <td class="text-center">${ev.id}</td>
                                <td><b>${ev.event_name}</b></td>
                                <td>${ev.location || '-'}</td>
                                <td class="text-center">${formattedDate}</td>
                                <td class="text-center">
                                    <button class="btn btn-warning btn-sm fw-bold me-1" onclick="editEvent(${ev.id})">แก้ไข</button>
                                    <button class="btn btn-danger btn-sm fw-bold" onclick="deleteEvent(${ev.id})">ลบ</button>
                                </td>
                            </tr>
                        `;

                        reportSelect.innerHTML += `<option value="${ev.id}">${ev.event_name} (${formattedDate})</option>`;
                    });
                });
        }

        function editEvent(id) {
            const ev = allEvents.find(e => e.id === id);
            if (!ev) return;

            document.getElementById("event_id").value = ev.id;
            document.getElementById("event_name").value = ev.event_name;
            document.getElementById("location").value = ev.location || '';
            document.getElementById("event_date").value = ev.event_date ? new Date(ev.event_date).toISOString().split('T')[0] : '';
            document.getElementById("btnSaveEvent").textContent = "อัปเดต Event";
            document.getElementById("btnSaveEvent").className = "btn btn-warning px-4 text-dark fw-bold";
            document.getElementById("btnResetEvent").classList.remove("d-none");
        }

        function resetEventForm() {
            document.getElementById("event_id").value = '';
            document.getElementById("event_name").value = '';
            document.getElementById("location").value = '';
            document.getElementById("event_date").value = '';
            document.getElementById("btnSaveEvent").textContent = "บันทึก Event";
            document.getElementById("btnSaveEvent").className = "btn btn-success px-4";
            document.getElementById("btnResetEvent").classList.add("d-none");
        }

        function deleteEvent(id) {
            if (!confirm("คุณต้องการลบ Event นี้ใช่หรือไม่?")) return;
            fetch(`/api/events/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || "ลบงานสำเร็จ");
                    loadEvents();
                });
        }
    </script>
</body>
</html>
