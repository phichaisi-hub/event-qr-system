<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Event QR System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Sarabun', 'Sukhumvit Set', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
        .login-header {
            background-color: #0d6efd;
            color: #ffffff;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding: 25px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="login-header">
            <h4 class="fw-bold mb-1">🔐 เข้าสู่ระบบ</h4>
            <small>ระบบจัดการ Event และสแกนเข้างาน</small>
        </div>
        <div class="card-body p-4">
            
            <div id="alertBox" class="alert alert-danger d-none mb-3" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" class="form-control" id="username" required placeholder="กรอกชื่อผู้ใช้งาน" autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">รหัสผ่าน (Password)</label>
                    <input type="password" class="form-control" id="password" required placeholder="กรอกรหัสผ่าน">
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary w-100 fw-bold py-2">เข้าสู่ระบบ</button>
            </form>

        </div>
    </div>

    <script src="js/login.js?v=1.0"></script>
</body>
</html>
