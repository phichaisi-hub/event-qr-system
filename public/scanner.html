<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สแกน QR Code ตรวจสอบเข้างาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .result-box { display: none; border-radius: 8px; padding: 20px; margin-top: 15px; }
        .SUCCESS { background: #d4edda; border: 2px solid #28a745; color: #155724; }
        .DUPLICATE { background: #fff3cd; border: 2px solid #ffc107; color: #856404; }
        .INVALID { background: #f8d7da; border: 2px solid #dc3545; color: #721c24; }
    </style>
</head>
<body class="bg-light py-4">
    <div class="container" style="max-width: 550px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center"><h4 class="mb-0">📷 สแกน QR Code ตรวจสอบเข้างาน</h4></div>
            <div class="card-body">
                <div id="reader"></div>
                <div class="input-group mt-3">
                    <input type="text" id="manual_id" class="form-control" placeholder="ป้อน Permit ID">
                    <button class="btn btn-primary" id="btnCheck">ตรวจสอบ</button>
                </div>
                <div id="resultBox" class="result-box">
                    <h4 id="resultTitle" class="text-center font-weight-bold"></h4>
                    <div id="resultDetails"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/scanner.js"></script>
</body>
</html>
