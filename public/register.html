<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเข้าปฏิบัติงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Sukhumvit Set', 'Segoe UI', Tahoma, sans-serif;
        }
        .register-card {
            max-width: 650px;
            margin: 40px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-header-custom {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card register-card">
        <div class="card-header-custom">
            <h3 class="mb-0 fw-bold">ลงทะเบียนเข้าปฏิบัติงาน</h3>
        </div>
        <div class="card-body p-4">
            <form id="registerForm" class="row g-3">
                
                <!-- ชื่องาน -->
                <div class="col-12">
                    <label class="form-label fw-bold">ชื่องานที่เข้าปฏิบัติงาน <span class="text-danger">*</span></label>
                    <select id="event_id" name="event_id" class="form-select" required>
                        <option value="">-- กำลังโหลดรายการ Event... --</option>
                    </select>
                </div>

                <!-- ชื่อ-นามสกุล & ชื่อบริษัท -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                    <input type="text" id="fullname" name="fullname" class="form-control" placeholder="เช่น พิชัย สิงหนนท์" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">ชื่อบริษัท <span class="text-danger">*</span></label>
                    <input type="text" id="company" name="company" class="form-control" placeholder="เช่น IMPACT" required>
                </div>

                <!-- ตำแหน่ง & เบอร์โทรศัพท์ -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">ตำแหน่ง</label>
                    <input type="text" id="position" name="position" class="form-control" placeholder="เช่น ASST Mng">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">เบอร์โทรศัพท์ <span class="text-danger">*</span></label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="เช่น 0892014217" required>
                </div>

                <!-- อีเมล -->
                <div class="col-12">
                    <label class="form-label fw-bold">อีเมลรับ QR Code <span class="text-danger">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="เช่น phichais@impact.co.th" required>
                </div>

                <!-- สถานที่จัดงาน & เลขที่บูธ -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">สถานที่จัดงาน</label>
                    <input type="text" id="location" class="form-control bg-light" placeholder="สถานที่จัดงานจะแสดงอัตโนมัติ" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">เลขที่บูธ <span class="text-danger">*</span></label>
                    <input type="text" id="booth_number" name="booth_number" class="form-control" placeholder="เช่น Hall 1 - A12" required>
                </div>

                <!-- ประเภทงาน & จำนวนผู้ใช้งาน -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">ประเภทงาน <span class="text-danger">*</span></label>
                    <select id="job_type" name="job_type" class="form-select" required>
                        <option value="ติดตั้ง">ติดตั้ง</option>
                        <option value="รื้อถอน">รื้อถอน</option>
                        <option value="ดูแลระบบ">ดูแลระบบ</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">จำนวนผู้เข้างาน (คน) <span class="text-danger">*</span></label>
                    <input type="number" id="num_workers" name="num_workers" class="form-control" value="1" min="1" required>
                </div>

                <!-- วันเวลาที่เข้าดำเนินการ -->
                <div class="col-12">
                    <label class="form-label fw-bold">วันเวลาที่เข้าดำเนินการ <span class="text-danger">*</span></label>
                    <input type="datetime-local" id="work_date" name="work_date" class="form-control" required>
                </div>

                <!-- ปุ่มส่งข้อมูล -->
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold">ลงทะเบียน</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const eventSelect = document.getElementById("event_id");
    const locationInput = document.getElementById("location");

    // 1. ดึงรายการ Event ทั้งหมดมาจาก API
    fetch('/api/events')
        .then(response => {
            if (!response.ok) throw new Error(" Network Error");
            return response.json();
        })
        .then(events => {
            eventSelect.innerHTML = '<option value="">-- เลือกชื่องาน --</option>';

            if (events.length === 0) {
                eventSelect.innerHTML = '<option value="">-- ไม่พบบันทึก Event ในระบบ --</option>';
                return;
            }

            events.forEach(event => {
                const option = document.createElement('option');
                option.value = event.id;
                option.textContent = event.event_name;
                // แนบข้อมูล location ไว้ใน dataset ของ option
                option.dataset.location = event.location || 'ไม่ได้ระบุสถานที่';
                eventSelect.appendChild(option);
            });
        })
        .catch(error => {
            console.error("Error loading events:", error);
            eventSelect.innerHTML = '<option value="">-- ไม่สามารถโหลดรายชื่อ Event ได้ --</option>';
        });

    // 2. เมื่อผู้ใช้เลือกชื่องาน ให้ดึงสถานที่มาแสดงในช่องอัตโนมัติ
    eventSelect.addEventListener("change", function () {
        const selectedOption = eventSelect.options[eventSelect.selectedIndex];
        
        if (selectedOption && selectedOption.dataset.location) {
            locationInput.value = selectedOption.dataset.location;
        } else {
            locationInput.value = '';
        }
    });

    // 3. ฟังก์ชันบันทึกข้อมูลการลงทะเบียน
    document.getElementById("registerForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = {
            event_id: document.getElementById("event_id").value,
            fullname: document.getElementById("fullname").value,
            company: document.getElementById("company").value,
            position: document.getElementById("position").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value,
            booth_number: document.getElementById("booth_number").value,
            job_type: document.getElementById("job_type").value,
            num_workers: document.getElementById("num_workers").value,
            work_date: document.getElementById("work_date").value
        };

        fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(res => res.json())
        .then(data => {
            alert("ลงทะเบียนสำเร็จเรียบร้อยแล้ว!");
            document.getElementById("registerForm").reset();
            locationInput.value = '';
        })
        .catch(err => {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการลงทะเบียน");
        });
    });
});
</script>

</body>
</html>
