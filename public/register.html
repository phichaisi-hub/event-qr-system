<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเข้าปฏิบัติงาน</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            max-width: 650px;
            margin: 30px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .card-header-custom {
            background-color: #0d6efd;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .form-label {
            font-weight: 600;
            color: #333333;
        }
        .btn-submit {
            background-color: #198754;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #146c43;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card register-card">
            <div class="card-header-custom">
                <h3 class="mb-0 fw-bold">ลงทะเบียนเข้าปฏิบัติงาน</h3>
            </div>
            <div class="card-body p-4">
                <form id="regForm">
                    
                    <!-- ชื่องาน Event -->
                    <div class="mb-3">
                        <label for="event_id" class="form-label">ชื่องานที่เข้าปฏิบัติงาน <span class="text-danger">*</span></label>
                        <select class="form-select" id="event_id" required>
                            <option value="">-- กำลังโหลดรายการ Event... --</option>
                        </select>
                    </div>

                    <!-- ชื่อ-นามสกุล & ชื่อบริษัท -->
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="full_name" class="form-label">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" required placeholder="นายสมชาย ใจดี">
                        </div>
                        <div class="col-md-6">
                            <label for="company_name" class="form-label">ชื่อบริษัท <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="company_name" required placeholder="บริษัท ตัวอย่าง จำกัด">
                        </div>
                    </div>

                    <!-- ตำแหน่ง & เบอร์โทรศัพท์ -->
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="position" class="form-label">ตำแหน่ง</label>
                            <input type="text" class="form-control" id="position" placeholder="Technician / Engineer">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">เบอร์โทรศัพท์ <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="phone" required placeholder="0812345678">
                        </div>
                    </div>

                    <!-- อีเมล -->
                    <div class="mb-3">
                        <label for="email" class="form-label">อีเมลรับ QR Code <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" required placeholder="name@company.com">
                    </div>

                    <!-- สถานที่จัดงาน (แสดงอัตโนมัติ) & เลขที่บูธ -->
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="event_location" class="form-label">สถานที่จัดงาน</label>
                            <input type="text" class="form-control bg-light" id="event_location" readonly placeholder="สถานที่จัดงานจะแสดงอัตโนมัติ">
                        </div>
                        <div class="col-md-6">
                            <label for="booth_no" class="form-label">เลขที่บูธ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="booth_no" required placeholder="เช่น Hall 1 - A12">
                        </div>
                    </div>

                    <!-- ประเภทงาน & จำนวนคน -->
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="work_type" class="form-label">ประเภทงาน <span class="text-danger">*</span></label>
                            <select class="form-select" id="work_type" required>
                                <option value="ติดตั้ง">ติดตั้ง</option>
                                <option value="รื้อถอน">รื้อถอน</option>
                                <option value="ซ่อมแซม">ซ่อมแซม</option>
                                <option value="ส่งของ / CATERING">ส่งของ / CATERING</option>
                                <option value="อื่นๆ">อื่นๆ</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="attendee_count" class="form-label">จำนวนผู้เข้างาน (คน) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="attendee_count" min="1" value="1" required>
                        </div>
                    </div>

                    <!-- ระบุประเภทงานอื่นๆ -->
                    <div class="mb-3 d-none" id="otherGroup">
                        <label for="work_type_other" class="form-label">ระบุประเภทงานอื่นๆ <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="work_type_other" placeholder="ระบุประเภทงาน">
                    </div>

                    <!-- วันเวลาที่เข้าดำเนินการ -->
                    <div class="mb-4">
                        <label for="scheduled_time" class="form-label">วันเวลาที่เข้าดำเนินการ <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="scheduled_time" required>
                    </div>

                    <!-- ปุ่ม Submit -->
                    <button type="submit" id="btnSubmit" class="btn btn-success w-100 btn-submit">ลงทะเบียน & รับ QR Code</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Register JS -->
    <script src="js/register.js?v=1.2"></script>
</body>
</html>
