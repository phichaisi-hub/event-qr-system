version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: event_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: event_qr_db
      TZ: Asia/Bangkok                         # <-- ตั้งเวลา MySQL Container เป็นเวลาไทย
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: event_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword

  app:
    build: .
    container_name: event_qr_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Bangkok                        # <-- ตั้งเวลา Node.js Container เป็นเวลาไทย
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=event_qr_db
      - EMAIL_USER=phichaisi@gmail.com
      - EMAIL_PASS=nhwy ubpl nhgt ymnu
      - SENDER_NAME=Event Security System
    depends_on:
      - db

volumes:
  db_data:
